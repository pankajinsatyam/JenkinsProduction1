# Trigger Test-1
name: Enterprise DevSecOps CICD Pipeline for Python
on:
  push:
    branches:
      - QA
    paths:
      - Day 07/python/**
      - .github/workflows/QA.yml
permissions:
  contents: write
  id-token: write

jobs:
  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true
      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn
 
  build-push-deploy:
    # Jenkins "agent any".
    # Use "self-hosted" if you want the container to keep running after the job ends.
    runs-on: ubuntu-latest
 
    steps:
      # Jenkins checks out code automatically; GitHub Actions needs this step
      - name: Checkout code
        uses: actions/checkout@v4
 
      # ---------- stage: build ----------
      - name: Build
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
 
      # ---------- stage: push ----------
      # Jenkins withCredentials(...) -> GitHub repository secrets
      - name: Push
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_PWD: ${{ secrets.DOCKERHUB_PWD }}
        run: |
          echo "$DOCKERHUB_PWD" | docker login -u "$DOCKERHUB_USER" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
 




