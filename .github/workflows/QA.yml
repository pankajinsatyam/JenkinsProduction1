# Trigger Test-1
name: Enterprise DevSecOps CICD Pipeline for Python
on:
  push:
    branches:
      - QA
    paths:
      - Day 07/python/**
      - .github/workflows/QA.yml
permissions:
  contents: write
  id-token: write
env:                                   # <- no spaces before "env"
  IMAGE: docker.io/pankajinoracle/secondrepo
  TAG: ${{ github.run_number }}
jobs:
  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true
      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn
 
  docker:
    name: Docker Build & Push
    needs:
      - checkov-dockerfile
    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout code              # <- added
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7 
        with:
          context: "Day 07/python"
          load: true
          push: false
          tags: |
            pankajinoracle/secondrepo:${{ github.sha }}
            pankajinoracle/secondrepo:latest


  

 




